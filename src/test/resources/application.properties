spring.application.name=votingSystem

security.jwt.secret-key=this-is-a-very-long-test-secret-key-at-least-256-bits-long-for-hs256
security.jwt.expiration-time=360000

spring.datasource.url=jdbc:h2:mem:voting_system_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

admin-name=admin
admin-email=email
admin-password=password


